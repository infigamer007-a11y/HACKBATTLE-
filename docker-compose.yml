services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SPEECHMATICS_API_KEY=${SPEECHMATICS_API_KEY}
      - THYMIA_API_KEY=${THYMIA_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_HTTP_URL=http://localhost:8000
        - NEXT_PUBLIC_BACKEND_WS_URL=ws://localhost:8000
        - BACKEND_HTTP_ORIGIN=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
