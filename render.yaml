services:
  # 1. TrueVoice FastAPI Backend (Persistent WebSockets + Audio Ingress + Claude AI)
  - type: web
    name: truevoice-backend
    runtime: docker
    dockerfilePath: TrueVoice/backend/Dockerfile
    dockerContext: TrueVoice/backend
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: SPEECHMATICS_API_KEY
        sync: false
      - key: PUTER_AUTH_TOKEN
        sync: false
      - key: THYMIA_API_KEY
        value: dummy-thymia-key
      - key: ANTHROPIC_API_KEY
        value: dummy-anthropic-key
      - key: ALLOWED_ORIGINS
        value: "*"

  # 2. TrueVoice Next.js Frontend (WebRTC + Dashboards + Real-time Audio/Video UI)
  - type: web
    name: truevoice-frontend
    runtime: node
    rootDir: TrueVoice/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BACKEND_HTTP_ORIGIN
        value: https://truevoice-backend-1mh1.onrender.com
      - key: NEXT_PUBLIC_BACKEND_HTTP_URL
        value: https://truevoice-backend-1mh1.onrender.com
      - key: NEXT_PUBLIC_BACKEND_WS_URL
        value: wss://truevoice-backend-1mh1.onrender.com
